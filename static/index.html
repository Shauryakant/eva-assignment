<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System - Management Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-hover: #1f2937;
            --card-bg: #1e293b;
            --border: #374151;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f9fafb;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 3rem; }
        
        /* Navbar */
        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
        .logo span { color: var(--primary); }
        .user-status { display: flex; align-items: center; gap: 1rem; font-size: 0.875rem; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; }

        /* Container */
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .stat-label { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.75rem; font-weight: 700; }

        /* Main Grid */
        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
        
        /* Form Inputs */
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
        input, textarea, select { width: 100%; padding: 0.75rem 1rem; background: #030712; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; transition: border-color 0.2s; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.25rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; width: 100%; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: #374151; color: var(--text); }
        .btn-secondary:hover { background: #4b5563; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto; }

        /* Filter Controls */
        .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.4rem 0.9rem; border-radius: 20px; background: #1f2937; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Ticket List */
        .ticket-card { background: #1f2937; border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; transition: border-color 0.2s; }
        .ticket-card:hover { border-color: #4b5563; }
        .ticket-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .ticket-title { font-weight: 600; font-size: 1rem; }
        .ticket-desc { color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1rem; }
        .ticket-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #6b7280; }

        /* Badges */
        .badge { padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge-open { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-in_progress { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-closed { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        /* Toast Notifications */
        #toastContainer { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { padding: 0.85rem 1.25rem; border-radius: 8px; color: white; font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); animation: slideIn 0.3s forwards; }
        .toast-success { background: #059669; }
        .toast-error { background: #dc2626; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .api-config { background: #111827; border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .api-config input { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            ⚡ Ticket<span>System</span>
        </div>
        <div class="user-status" id="userNav">
            <span style="color: var(--text-muted)">Not Authenticated</span>
        </div>
    </nav>

    <div class="container">
        <!-- API Endpoint Configuration for Vercel/Remote deployment -->
        <div class="api-config">
            <label style="margin: 0; white-space: nowrap;">API Host:</label>
            <input type="text" id="apiHostInput" placeholder="http://localhost:8080" value="">
            <button class="btn btn-secondary btn-sm" onclick="saveApiHost()">Save Host</button>
        </div>

        <!-- Dashboard Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">TOTAL TICKETS</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">OPEN</div>
                <div class="stat-value" style="color: #60a5fa" id="statOpen">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">IN PROGRESS</div>
                <div class="stat-value" style="color: #fbbf24" id="statInProgress">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">CLOSED</div>
                <div class="stat-value" style="color: #34d399" id="statClosed">0</div>
            </div>
        </div>

        <div class="grid">
            <!-- Left Sidebar: Auth & Ticket Creation -->
            <div>
                <div class="card" id="authCard">
                    <div class="card-title">Authentication</div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="authEmail" placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="authPassword" placeholder="••••••••">
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn" onclick="handleRegister()">Register</button>
                        <button class="btn btn-secondary" onclick="handleLogin()">Login</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Create Ticket</div>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="ticketTitle" placeholder="e.g., API Rate Limiting Issue">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="ticketDesc" rows="3" placeholder="Provide detailed information..."></textarea>
                    </div>
                    <button class="btn" onclick="handleCreateTicket()">Create Ticket</button>
                </div>
            </div>

            <!-- Right Content: Ticket List & Management -->
            <div>
                <div class="card">
                    <div class="card-title">
                        <span>Ticket Board</span>
                        <button class="btn btn-secondary btn-sm" onclick="fetchTickets()">↻ Refresh</button>
                    </div>

                    <div class="controls">
                        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
                        <button class="filter-btn" onclick="setFilter('open', this)">Open</button>
                        <button class="filter-btn" onclick="setFilter('in_progress', this)">In Progress</button>
                        <button class="filter-btn" onclick="setFilter('closed', this)">Closed</button>
                        <input type="text" id="searchInput" placeholder="Search tickets..." oninput="renderTickets()" style="flex: 1; min-width: 150px; padding: 0.4rem 0.8rem; font-size: 0.8rem;">
                    </div>

                    <div id="ticketsList">
                        <p style="color: var(--text-muted); text-align: center; padding: 2rem;">Log in to view your tickets.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        let apiHost = localStorage.getItem('api_host') || window.location.origin;
        if (apiHost.endsWith('/')) apiHost = apiHost.slice(0, -1);
        document.getElementById('apiHostInput').value = apiHost;

        let token = localStorage.getItem('jwt_token') || '';
        let currentUserEmail = localStorage.getItem('user_email') || '';
        let allTickets = [];
        let currentFilter = 'all';

        function saveApiHost() {
            let host = document.getElementById('apiHostInput').value.trim();
            if (!host) host = window.location.origin;
            if (host.endsWith('/')) host = host.slice(0, -1);
            apiHost = host;
            localStorage.setItem('api_host', apiHost);
            showToast('API Host updated to ' + apiHost, 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = (type === 'success' ? '✓ ' : '✕ ') + message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function updateUIState() {
            const userNav = document.getElementById('userNav');
            if (token && currentUserEmail) {
                userNav.innerHTML = `
                    <div class="avatar">${currentUserEmail[0].toUpperCase()}</div>
                    <span>${currentUserEmail}</span>
                    <button class="btn btn-secondary btn-sm btn-danger" onclick="handleLogout()">Logout</button>
                `;
            } else {
                userNav.innerHTML = `<span style="color: var(--text-muted)">Not Authenticated</span>`;
            }
        }

        async function handleRegister() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return showToast('Email and password are required', 'error');

            try {
                const res = await fetch(`${apiHost}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Registration successful! Please log in.', 'success');
                } else {
                    showToast(data.error || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast('Failed to connect to API server', 'error');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return showToast('Email and password are required', 'error');

            try {
                const res = await fetch(`${apiHost}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    token = data.token;
                    currentUserEmail = email;
                    localStorage.setItem('jwt_token', token);
                    localStorage.setItem('user_email', currentUserEmail);
                    updateUIState();
                    showToast('Logged in successfully', 'success');
                    fetchTickets();
                } else {
                    showToast(data.error || 'Login failed', 'error');
                }
            } catch (err) {
                showToast('Failed to connect to API server', 'error');
            }
        }

        async function handleLogout() {
            try {
                await fetch(`${apiHost}/auth/logout`, { method: 'POST' });
            } catch (err) {}
            token = '';
            currentUserEmail = '';
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_email');
            allTickets = [];
            updateUIState();
            updateStats();
            document.getElementById('ticketsList').innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem;">Log in to view your tickets.</p>`;
            showToast('Logged out successfully', 'success');
        }

        async function handleCreateTicket() {
            if (!token) return showToast('Please log in first', 'error');
            const title = document.getElementById('ticketTitle').value.trim();
            const description = document.getElementById('ticketDesc').value.trim();
            if (!title) return showToast('Ticket title is required', 'error');

            try {
                const res = await fetch(`${apiHost}/tickets`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, description })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Ticket created successfully', 'success');
                    document.getElementById('ticketTitle').value = '';
                    document.getElementById('ticketDesc').value = '';
                    fetchTickets();
                } else {
                    showToast(data.error || 'Failed to create ticket', 'error');
                }
            } catch (err) {
                showToast('Failed to connect to API server', 'error');
            }
        }

        async function fetchTickets() {
            if (!token) return;
            try {
                const res = await fetch(`${apiHost}/tickets`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    allTickets = await res.json();
                    updateStats();
                    renderTickets();
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Failed to load tickets', 'error');
                }
            } catch (err) {
                showToast('Failed to connect to API server', 'error');
            }
        }

        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            renderTickets();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = allTickets.length;
            document.getElementById('statOpen').innerText = allTickets.filter(t => t.status === 'open').length;
            document.getElementById('statInProgress').innerText = allTickets.filter(t => t.status === 'in_progress').length;
            document.getElementById('statClosed').innerText = allTickets.filter(t => t.status === 'closed').length;
        }

        function renderTickets() {
            const container = document.getElementById('ticketsList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allTickets.filter(t => {
                const matchesFilter = currentFilter === 'all' || t.status === currentFilter;
                const matchesSearch = t.title.toLowerCase().includes(searchQuery) || (t.description && t.description.toLowerCase().includes(searchQuery));
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No matching tickets found.</p>`;
                return;
            }

            container.innerHTML = filtered.map(t => `
                <div class="ticket-card">
                    <div class="ticket-header">
                        <span class="ticket-title">${escapeHtml(t.title)}</span>
                        <span class="badge badge-${t.status}">${t.status.replace('_', ' ')}</span>
                    </div>
                    <div class="ticket-desc">${escapeHtml(t.description || 'No description provided.')}</div>
                    <div class="ticket-meta">
                        <span>ID: ${t.id}</span>
                        <div>
                            ${t.status === 'open' ? `<button class="btn btn-sm" onclick="updateStatus('${t.id}', 'in_progress')">Start Progress →</button>` : ''}
                            ${t.status === 'in_progress' ? `<button class="btn btn-sm" style="background: #10b981" onclick="updateStatus('${t.id}', 'closed')">Mark Closed ✓</button>` : ''}
                            ${t.status === 'closed' ? `<span style="color: #9ca3af">Closed</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`${apiHost}/tickets/${id}/status`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast(`Status updated to ${newStatus.replace('_', ' ')}`, 'success');
                    fetchTickets();
                } else {
                    showToast(data.error || 'Failed to update status', 'error');
                }
            } catch (err) {
                showToast('Failed to connect to API server', 'error');
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        updateUIState();
        if (token) fetchTickets();
    </script>
</body>
</html>
